server:
  port: 8080
  compression:
    enabled: true

spring:
  main:
    banner-mode: off

tradevision:
  data-dir: ./data
  # EVERY_BATCH = fsync per journal batch (no acknowledged order is ever lost); OS_CACHE = survive process crashes only.
  sync-policy: OS_CACHE
  snapshot-every: 250000
  # FOLLOWER: a background engine replica replays the journal and snapshots off the matching thread.
  snapshot-mode: FOLLOWER
  busy-spin: false
  admin-token: change-me
  starting-balance-dollars: 10000
  bots:
    enabled: true
  polymarket:
    enabled: true
    markets: 8
    rest-url: https://clob.polymarket.com
    ws-url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  # Projections. Optional: the exchange runs without them; docker compose turns both on.
  postgres:
    enabled: false
    url: jdbc:postgresql://localhost:5432/tradevision
    user: tradevision
    password: tradevision
    batch-size: 2000
  clickhouse:
    enabled: false
    url: http://localhost:8123
    database: tradevision
    user: default
    password: ""

logging:
  level:
    io.tradevision: INFO
